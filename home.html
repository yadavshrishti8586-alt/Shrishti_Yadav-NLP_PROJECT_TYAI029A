<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tutor - Home</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #202020;
            font-family: Arial, sans-serif;
        }

        .home-screen {
            width: 375px;
            height: 780px;
            background: #f0f8fc;
            position: relative;
            padding: 20px;
            overflow: hidden;
        }

        /* Header */
        .header {
            text-align: center;
        }

        .header h1 {
            font-size: 23px;
            color: #263143;
            margin-bottom: 20px;
        }

        .header p {
            color: #6f7888;
            font-size: 16px;
            margin-bottom: 25px;
        }

        /* Search */
        .search {
            width: 220px;
            margin: auto;
            font-size: 16px;
            color: #222;
            border: none;
            background: transparent;
            outline: none;
            text-align: center;
            display: block;
        }

        /* Ask AI Button */
        .ask-button {
            display: block;
            width: 215px;
            height: 37px;
            margin: 18px auto 53px;
            border: none;
            border-radius: 11px;
            background: #3d82ed;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }

        .ask-button:hover {
            background: #286fdc;
        }

        /* Feature Grid */
        .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 27px 28px;
            justify-content: center;
            padding: 0 25px;
        }

        .feature {
            width: 128px;
            height: 100px;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 19px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .feature:hover {
            transform: scale(1.04);
        }

        .feature-icon {
            font-size: 14px;
            align-self: flex-start;
            margin-left: 17px;
            margin-bottom: 5px;
        }

        .tutor {
            background: #e1edff;
        }

        .voice {
            background: #d8f9e5;
        }

        .scanner {
            background: #ffebd2;
        }

        .quiz {
            background: #f1e7ff;
        }

        .progress {
            background: #fbe7f3;
        }

        .settings {
            background: #e1f2ff;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: absolute;
            bottom: 22px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-around;
            text-align: center;
        }

        .nav-item {
            font-size: 15px;
            color: #111;
            cursor: pointer;
        }

        .nav-icon {
            display: block;
            font-size: 15px;
            margin-bottom: 4px;
        }
    </style>
</head>

<body>

    <div class="home-screen">

        <!-- Header -->
        <div class="header">

            <h1>Good Morning 👋</h1>

            <p>Welcome to AI Tutor</p>

            <input
                class="search"
                type="text"
                placeholder="🔍 Search Topics ....."
            >

        </div>


        <!-- Ask AI -->
        <button class="ask-button" onclick="openTutor()">
            Ask AI Tutor
        </button>


        <!-- Features -->
        <div class="features">

            <div class="feature tutor" onclick="openTutor()">
                <span class="feature-icon">🤖</span>
                AI Tutor
            </div>

            <div class="feature voice" onclick="openVoice()">
                <span class="feature-icon">🎤</span>
                Voice Tutor
            </div>

            <div class="feature scanner" onclick="openScanner()">
                <span class="feature-icon">📷</span>
                Homework<br>Scanner
            </div>

            <div class="feature quiz" onclick="openQuiz()">
                <span class="feature-icon">📚</span>
                Quiz
            </div>

            <div class="feature progress" onclick="openProgress()">
                <span class="feature-icon">📈</span>
                Progress
            </div>

            <div class="feature settings" onclick="openSettings()">
                <span class="feature-icon">⚙️</span>
                Settings
            </div>

        </div>


        <!-- Bottom Navigation -->
        <div class="bottom-nav">

            <div class="nav-item" onclick="goHome()">
                <span class="nav-icon">🏠</span>
                Home
            </div>

            <div class="nav-item" onclick="openTutor()">
                <span class="nav-icon">🤖</span>
                Tutor
            </div>

            <div class="nav-item" onclick="openScanner()">
                <span class="nav-icon">📷</span>
                Scanner
            </div>

            <div class="nav-item" onclick="openProfile()">
                <span class="nav-icon">👤</span>
                Profile
            </div>

        </div>

    </div>


    <script>

        function openTutor() {
            window.location.href = "tutor.html";
        }

        function openVoice() {
            window.location.href = "voice.html";
        }

        function openScanner() {
            window.location.href = "scanner.html";
        }

        function openQuiz() {
            window.location.href = "quiz.html";
        }

        function openProgress() {
            window.location.href = "progress.html";
        }

        function openSettings() {
            window.location.href = "settings.html";
        }

        function openProfile() {
            window.location.href = "profile.html";
        }

        function goHome() {
            window.location.href = "home.html";
        }

    </script>

</body>
</html>
