<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Material | Gyaan AI Tutor</title><link rel="stylesheet" href="index.css"><style>body{background:#f6f8fc;padding-top:90px}.page{max-width:1120px;margin:32px auto;padding:0 20px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}.toolbar input,.toolbar select{padding:12px;border:1px solid #d7ddeb;border-radius:9px;font:inherit;flex:1;min-width:210px}.button{background:#3157d5;color:#fff;padding:12px 16px;border-radius:9px;text-decoration:none;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.card{background:#fff;border:1px solid #e5e9f2;border-radius:14px;padding:20px}.card h2{font-size:18px;margin:0 0 8px}.meta{font-size:13px;color:#687387;margin:8px 0}.description{color:#4c596d;min-height:42px}.actions{display:flex;gap:9px;margin-top:16px}.actions a{border:1px solid #d7ddeb;border-radius:8px;padding:9px 11px;color:#3157d5;text-decoration:none;font-size:13px;font-weight:700}.empty,.status{background:#fff;border-radius:12px;padding:24px;color:#687387}@media(max-width:700px){.nav-links{display:none}}</style></head>
<body><nav class="navbar"><div class="nav-container"><a href="/" class="logo"><div class="logo-icon">✦</div><div class="logo-text"><span>GYAAN</span><small>AI TUTOR</small></div></a><div class="nav-links" id="navLinks"><a href="/" data-i18n="home">Home</a><a href="/dashboard" data-i18n="dashboard">Dashboard</a><a href="/ai-tutor" data-i18n="aiTutor">AI Tutor</a><a href="/quiz" data-i18n="quiz">Quiz</a><a href="/study-materials" class="active" data-i18n="studyMaterial">Study Material</a><a href="/upload-material" data-i18n="uploadMaterial">Upload Material</a><div class="language-menu" id="languageMenu"><button class="language-btn" id="languageBtn" type="button">🌐 <span id="selectedLanguage">Language</span>⌄</button><div class="language-dropdown"><a href="#" data-lang="English">English</a><a href="#" data-lang="Hindi">हिंदी</a><a href="#" data-lang="Marathi">मराठी</a></div></div></div><div class="nav-actions"><a href="/login" class="login-btn" data-i18n="login">Login</a><button class="profile-btn" id="logout" data-i18n="logout">Log out</button></div></div></nav>
<main class="page"><div style="display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap"><div><h1 data-i18n="studyMaterial">Study Material</h1><p class="meta">Find shared notes, presentations and reference files.</p></div><a class="button" href="/upload-material" data-i18n="uploadMaterial">Upload Material</a></div><div class="toolbar"><input id="search" data-i18n-placeholder="search" placeholder="Search materials"><select id="subject"><option value="" data-i18n="allSubjects">All subjects</option></select></div><div id="status" class="status" data-i18n="loading">Loading...</div><section id="grid" class="grid"></section></main><script src="common.js"></script><script>if(!requireAuth()){};document.getElementById('logout').onclick=logout;const status=document.getElementById('status'),grid=document.getElementById('grid'),search=document.getElementById('search'),subject=document.getElementById('subject');let materials=[];const escapeHtml=value=>{const node=document.createElement('span');node.textContent=value||'';return node.innerHTML};const formatSize=bytes=>bytes<1024*1024?`${Math.round(bytes/1024)} KB`:`${(bytes/1024/1024).toFixed(1)} MB`;function render(){const query=search.value.toLowerCase(),selected=subject.value;const filtered=materials.filter(item=>(!selected||item.subject===selected)&&(!query||`${item.title} ${item.subject} ${item.description}`.toLowerCase().includes(query)));grid.innerHTML=filtered.map(item=>`<article class="card"><h2>${escapeHtml(item.title)}</h2><div class="meta">${escapeHtml(item.subject)} · ${escapeHtml(item.fileName)} · ${formatSize(item.fileSize)}</div><p class="description">${escapeHtml(item.description||'')}</p><div class="meta"><span data-i18n="uploadedBy">Uploaded by</span> ${escapeHtml(item.uploadedBy?.name||'Student')} · ${new Date(item.createdAt).toLocaleDateString()}</div><div class="actions"><a href="${apiUrl(item.fileUrl)}" target="_blank" rel="noopener" data-i18n="view">View</a><a href="${apiUrl(item.fileUrl)}" download data-i18n="download">Download</a></div></article>`).join('');status.style.display=filtered.length?'none':'block';if(!filtered.length){status.textContent=APP_TRANSLATIONS[currentLanguage()].empty;status.className='empty show'}}async function load(){try{const response=await fetch(apiUrl('/api/materials'),{headers:authHeaders()});const data=await response.json();if(response.status===401)return logout();if(!response.ok)throw new Error(data.message||'Unable to load materials.');materials=data.materials||[];[...new Set(materials.map(item=>item.subject))].sort().forEach(value=>{const option=document.createElement('option');option.value=value;option.textContent=value;subject.appendChild(option)});render()}catch(error){status.textContent=error.message;status.className='status'}}search.oninput=render;subject.onchange=render;load();</script></body></html>
