<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upload Material | Gyaan AI Tutor</title><link rel="stylesheet" href="index.css"><style>body{background:#f6f8fc;padding-top:90px}.page{max-width:760px;margin:32px auto;padding:0 20px}.panel{background:#fff;border:1px solid #e5e9f2;border-radius:16px;padding:28px;box-shadow:0 12px 34px #17203312}.panel h1{margin:0 0 8px}.muted{color:#687387}.field{display:grid;gap:7px;margin-top:18px}.field input,.field textarea,.field select{border:1px solid #d7ddeb;border-radius:9px;padding:12px;font:inherit}.field textarea{min-height:110px;resize:vertical}.submit{margin-top:22px;background:#3157d5;color:#fff;border:0;border-radius:9px;padding:13px 18px;font:inherit;font-weight:700;cursor:pointer}.message{display:none;margin-top:16px;padding:12px;border-radius:9px}.message.show{display:block}.success{background:#e8f8ef;color:#16733d}.error{background:#fff0f0;color:#a52626}@media(max-width:700px){.nav-links{display:none}.panel{padding:20px}}</style></head>
<body><nav class="navbar"><div class="nav-container"><a href="/" class="logo"><div class="logo-icon">✦</div><div class="logo-text"><span>GYAAN</span><small>AI TUTOR</small></div></a><div class="nav-links" id="navLinks"><a href="/" data-i18n="home">Home</a><a href="/dashboard" data-i18n="dashboard">Dashboard</a><a href="/ai-tutor" data-i18n="aiTutor">AI Tutor</a><a href="/quiz" data-i18n="quiz">Quiz</a><a href="/study-materials" data-i18n="studyMaterial">Study Material</a><a href="/upload-material" class="active" data-i18n="uploadMaterial">Upload Material</a><div class="language-menu" id="languageMenu"><button class="language-btn" id="languageBtn" type="button">🌐 <span id="selectedLanguage">Language</span>⌄</button><div class="language-dropdown"><a href="#" data-lang="English">English</a><a href="#" data-lang="Hindi">हिंदी</a><a href="#" data-lang="Marathi">मराठी</a></div></div></div><div class="nav-actions"><a href="/login" class="login-btn" data-i18n="login">Login</a><button class="profile-btn" id="logout" data-i18n="logout">Log out</button></div></div></nav>
<main class="page"><section class="panel"><h1 data-i18n="uploadMaterial">Upload Material</h1><p class="muted">Share useful study content with your student community.</p><form id="uploadForm"><div class="field"><label for="title" data-i18n="title">Material title</label><input id="title" name="title" required maxlength="160"></div><div class="field"><label for="subject" data-i18n="subject">Subject</label><input id="subject" name="subject" list="subjects" required maxlength="80"><datalist id="subjects"><option>Mathematics</option><option>Java</option><option>Python</option><option>DBMS</option><option>Web Development</option><option>Artificial Intelligence</option><option>Other</option></datalist></div><div class="field"><label for="description" data-i18n="description">Description</label><textarea id="description" name="description" maxlength="1000"></textarea></div><div class="field"><label for="file" data-i18n="chooseFile">Choose file</label><input id="file" name="file" type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.txt,.jpg,.jpeg,.png,.webp" required><small class="muted">PDF, DOC/DOCX, PPT/PPTX, TXT or images. Maximum 20 MB.</small></div><button class="submit" id="submit" type="submit" data-i18n="upload">Upload material</button><div id="message" class="message"></div></form></section></main><script src="common.js"></script><script>if(!requireAuth()){};document.getElementById('logout').onclick=logout;const form=document.getElementById('uploadForm'),message=document.getElementById('message'),submit=document.getElementById('submit');form.addEventListener('submit',async event=>{event.preventDefault();message.className='message';const file=document.getElementById('file').files[0];if(!file||file.size>20*1024*1024){message.textContent='Choose a supported file smaller than 20 MB.';message.className='message error show';return}submit.disabled=true;submit.textContent='Uploading...';try{const response=await fetch(apiUrl('/api/materials'),{method:'POST',headers:authHeaders(),body:new FormData(form)});const data=await response.json();if(!response.ok)throw new Error(data.message||'Upload failed.');message.textContent=data.message||APP_TRANSLATIONS[currentLanguage()].success;message.className='message success show';form.reset();setTimeout(()=>window.location.href='/study-materials',700)}catch(error){message.textContent=error.message;message.className='message error show'}finally{submit.disabled=false;translatePage()}});</script></body></html>
