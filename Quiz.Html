
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gyaan AI - Quiz</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
            min-height: 100vh;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            height: 70px;
            background: white;
            border-bottom: 1px solid #e8eaf0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 23px;
            font-weight: 800;
            color: #2563eb;
        }

        .back-btn {
            border: none;
            background: #eef4ff;
            color: #2563eb;
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: .2s;
        }

        .back-btn:hover {
            background: #2563eb;
            color: white;
        }

        /* ================= MAIN ================= */

        .container {
            width: 92%;
            max-width: 1050px;
            margin: 35px auto;
        }

        .hero {
            text-align: center;
            margin-bottom: 30px;
        }

        .hero h1 {
            font-size: 38px;
            margin-bottom: 8px;
        }

        .hero h1 span {
            color: #2563eb;
        }

        .hero p {
            color: #697386;
            font-size: 15px;
        }

        /* ================= SETUP ================= */

        .setup-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0,0,0,.06);
        }

        .setup-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 22px;
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            font-size: 14px;
        }

        select {
            width: 100%;
            padding: 14px;
            border: 1px solid #dfe3eb;
            border-radius: 11px;
            outline: none;
            background: white;
            font-size: 15px;
            cursor: pointer;
        }

        select:focus {
            border-color: #2563eb;
        }

        .start-btn {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: .2s;
        }

        .start-btn:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        /* ================= QUIZ ================= */

        .quiz-section {
            display: none;
        }

        .quiz-header {
            background: white;
            padding: 18px 22px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 20px rgba(0,0,0,.05);
        }

        .quiz-title {
            font-weight: 800;
        }

        .progress-text {
            color: #2563eb;
            font-weight: 700;
        }

        .progress-bar {
            height: 8px;
            background: #e9edf5;
            border-radius: 20px;
            margin-top: 12px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            width: 5%;
            background: #2563eb;
            transition: .3s;
        }

        .question-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 35px rgba(0,0,0,.06);
        }

        .question-number {
            color: #2563eb;
            font-weight: 800;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .question-text {
            font-size: 23px;
            line-height: 1.5;
            font-weight: 700;
            margin-bottom: 22px;
        }

        .question-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 22px;
            flex-wrap: wrap;
        }

        .small-btn {
            border: 1px solid #dfe3eb;
            background: #f8fafc;
            padding: 9px 13px;
            border-radius: 9px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
        }

        .small-btn:hover {
            background: #eef4ff;
            color: #2563eb;
        }

        .translation {
            display: none;
            background: #f1f5ff;
            border-left: 4px solid #2563eb;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options {
            display: grid;
            gap: 13px;
        }

        .option {
            border: 1px solid #e0e4eb;
            padding: 16px;
            border-radius: 12px;
            cursor: pointer;
            transition: .2s;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .option:hover {
            border-color: #2563eb;
            background: #f7faff;
        }

        .option.selected {
            border-color: #2563eb;
            background: #eef4ff;
        }

        .option input {
            accent-color: #2563eb;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            gap: 10px;
        }

        .nav-btn {
            padding: 12px 20px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 700;
        }

        .previous {
            background: #eef0f4;
            color: #333;
        }

        .next {
            background: #2563eb;
            color: white;
        }

        .submit {
            background: #16a34a;
            color: white;
        }

        /* ================= RESULT ================= */

        .result-section {
            display: none;
        }

        .result-card {
            background: white;
            border-radius: 22px;
            padding: 40px 25px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0,0,0,.07);
        }

        .result-icon {
            font-size: 55px;
            margin-bottom: 12px;
        }

        .result-card h2 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        .score {
            font-size: 52px;
            font-weight: 900;
            color: #2563eb;
            margin: 15px 0;
        }

        .percentage {
            font-size: 18px;
            color: #667085;
        }

        .result-message {
            margin: 18px auto;
            max-width: 500px;
            color: #596275;
            line-height: 1.6;
        }

        .result-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        .result-btn {
            padding: 13px 22px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
        }

        .retake {
            background: #2563eb;
            color: white;
        }

        .home {
            background: #eef0f4;
            color: #333;
        }

        /* ================= RESPONSIVE ================= */

        @media(max-width: 700px) {

            .navbar {
                padding: 0 4%;
            }

            .container {
                width: 94%;
                margin: 25px auto;
            }

            .hero h1 {
                font-size: 29px;
            }

            .setup-grid {
                grid-template-columns: 1fr;
            }

            .setup-card {
                padding: 20px;
            }

            .question-card {
                padding: 20px;
            }

            .question-text {
                font-size: 19px;
            }

            .quiz-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            .navigation {
                flex-direction: column;
            }

            .nav-btn {
                width: 100%;
            }

            .score {
                font-size: 43px;
            }
        }
    </style>
</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar">
    <div class="logo">Gyaan AI</div>

    <a href="/" class="back-btn">
    ← Back
</a>
</nav>


<main class="container">

    <!-- ================= HERO ================= -->

    <section class="hero">
        <h1>Test Your <span>Knowledge</span></h1>
        <p>Select your class and subject to start a 20-question quiz.</p>
    </section>


    <!-- ================= SETUP ================= -->

    <section id="setupSection" class="setup-card">

        <div class="setup-grid">

            <div class="field">
                <label>Select Class</label>

                <select id="classSelect">
                    <option value="">Choose Class</option>
                    <option value="5">Class 5</option>
                    <option value="6">Class 6</option>
                    <option value="7">Class 7</option>
                    <option value="8">Class 8</option>
                    <option value="9">Class 9</option>
                    <option value="10">Class 10</option>
                    <option value="11">Class 11</option>
                    <option value="12">Class 12</option>
                </select>
            </div>


            <div class="field">
                <label>Select Subject</label>

                <select id="subjectSelect">

                    <option value="">Choose Subject</option>

                    <option value="math">
                        Mathematics
                    </option>

                    <option value="science">
                        Science
                    </option>

                    <option value="geography">
                        Geography
                    </option>

                    <option value="physics">
                        Physics
                    </option>

                    <option value="computer">
                        Computer Science
                    </option>

                    <option value="marathi">
                        Marathi
                    </option>

                    <option value="hindi">
                        Hindi
                    </option>

                </select>
            </div>

        </div>


        <button class="start-btn" onclick="startQuiz()">
            Start 20 Questions Quiz →
        </button>

    </section>


    <!-- ================= QUIZ ================= -->

    <section id="quizSection" class="quiz-section">

        <div class="quiz-header">

            <div>
                <div class="quiz-title" id="quizTitle">
                    Mathematics
                </div>

                <div class="progress-bar">
                    <div id="progress" class="progress"></div>
                </div>
            </div>

            <div class="progress-text" id="progressText">
                Question 1 / 20
            </div>

        </div>


        <div class="question-card">

            <div class="question-number" id="questionNumber">
                QUESTION 1
            </div>

            <div class="question-text" id="questionText">
                Question goes here
            </div>


            <div class="question-actions">

                <button class="small-btn" onclick="speakQuestion()">
                    🔊 Listen
                </button>

                <button class="small-btn" onclick="translateQuestion()">
                    🌐 Translate
                </button>

            </div>


            <div id="translationBox" class="translation"></div>


            <div id="options" class="options"></div>


            <div class="navigation">

                <button
                    id="prevBtn"
                    class="nav-btn previous"
                    onclick="previousQuestion()">
                    ← Previous
                </button>

                <button
                    id="nextBtn"
                    class="nav-btn next"
                    onclick="nextQuestion()">
                    Next →
                </button>

            </div>

        </div>

    </section>


    <!-- ================= RESULT ================= -->

    <section id="resultSection" class="result-section">

        <div class="result-card">

            <div id="resultIcon" class="result-icon">
                🏆
            </div>

            <h2 id="resultTitle">
                Excellent!
            </h2>

            <div class="score">
                <span id="correctScore">0</span>
                /
                <span>20</span>
            </div>

            <div class="percentage">
                Percentage:
                <strong id="percentage">
                    0%
                </strong>
            </div>

            <p class="result-message" id="resultMessage">
                Great work!
            </p>


            <div class="result-buttons">

                <button
                    class="result-btn retake"
                    onclick="retakeQuiz()">
                    🔄 Retake Quiz
                </button>

                <button
                    class="result-btn home"
                    onclick="goHome()">
                    ← Back to Quiz
                </button>

            </div>

        </div>

    </section>

</main>

    /* =====================================================
       VARIABLES
       ===================================================== */

    let currentQuestion = 0;
    let selectedAnswers = [];
    let quizQuestions = [];
    let selectedClass = "";
    let selectedSubject = "";


    const subjectNames = {
        math: "Mathematics",
        science: "Science",
        geography: "Geography",
        physics: "Physics",
        computer: "Computer Science",
        marathi: "Marathi",
        hindi: "Hindi"
    };


    /* =====================================================
       START QUIZ
       ===================================================== */

    function startQuiz() {

        selectedClass =
            document.getElementById("classSelect").value;

        selectedSubject =
            document.getElementById("subjectSelect").value;


        if (!selectedClass || !selectedSubject) {

            alert("Please select Class and Subject first.");

            return;
        }


        quizQuestions =
            questionBank[selectedSubject].map(item => {

                return {
                    question: item[0],
                    options: item[1],
                    answer: item[2]
                };

            });


        selectedAnswers =
            new Array(quizQuestions.length).fill(null);

        currentQuestion = 0;


        document.getElementById("setupSection").style.display =
            "none";

        document.getElementById("quizSection").style.display =
            "block";

        document.getElementById("resultSection").style.display =
            "none";


        document.getElementById("quizTitle").innerText =
            subjectNames[selectedSubject] +
            " • Class " +
            selectedClass;


        showQuestion();
    }


    /* =====================================================
       SHOW QUESTION
       ===================================================== */

    function showQuestion() {

        const q = quizQuestions[currentQuestion];


        document.getElementById("questionNumber").innerText =
            "QUESTION " + (currentQuestion + 1);


        document.getElementById("questionText").innerText =
            q.question;


        document.getElementById("progressText").innerText =
            "Question " +
            (currentQuestion + 1) +
            " / " +
            quizQuestions.length;


        const percentage =
            ((currentQuestion + 1) /
            quizQuestions.length) * 100;


        document.getElementById("progress").style.width =
            percentage + "%";


        document.getElementById("translationBox").style.display =
            "none";


        const optionsBox =
            document.getElementById("options");


        optionsBox.innerHTML = "";


        q.options.forEach((option, index) => {

            const label =
                document.createElement("label");

            label.className = "option";


            if (selectedAnswers[currentQuestion] === option) {
                label.classList.add("selected");
            }


            label.innerHTML = `
                <input
                    type="radio"
                    name="answer"
                    value="${escapeHTML(option)}"
                    ${selectedAnswers[currentQuestion] === option ? "checked" : ""}
                >

                <span>${escapeHTML(option)}</span>
            `;


            label.onclick = function() {

                selectedAnswers[currentQuestion] =
                    option;

                document
                    .querySelectorAll(".option")
                    .forEach(el =>
                        el.classList.remove("selected")
                    );

                label.classList.add("selected");
            };


            optionsBox.appendChild(label);

        });


        document.getElementById("prevBtn").style.visibility =
            currentQuestion === 0
                ? "hidden"
                : "visible";


        const nextBtn =
            document.getElementById("nextBtn");


        if (currentQuestion === quizQuestions.length - 1) {

            nextBtn.innerText =
                "Submit Quiz ✓";

            nextBtn.className =
                "nav-btn submit";

            nextBtn.onclick =
                submitQuiz;

        } else {

            nextBtn.innerText =
                "Next →";

            nextBtn.className =
                "nav-btn next";

            nextBtn.onclick =
                nextQuestion;
        }

    }


    /* =====================================================
       NEXT QUESTION
       ===================================================== */

    function nextQuestion() {

        if (!selectedAnswers[currentQuestion]) {

            alert("Please select an answer.");

            return;
        }


        if (currentQuestion <
            quizQuestions.length - 1) {

            currentQuestion++;

            showQuestion();

        }

    }


    /* =====================================================
       PREVIOUS
       ===================================================== */

    function previousQuestion() {

        if (currentQuestion > 0) {

            currentQuestion--;

            showQuestion();

        }

    }


    /* =====================================================
       SUBMIT QUIZ
       ===================================================== */

    async function submitQuiz() {

        if (!selectedAnswers[currentQuestion]) {

            alert("Please select an answer.");

            return;
        }


        let score = 0;


        quizQuestions.forEach((q, index) => {

            if (selectedAnswers[index] === q.answer) {

                score++;

            }

        });


        const total =
            quizQuestions.length;


        const percentage =
            Math.round((score / total) * 100);


        let title;
        let icon;
        let message;


        if (percentage >= 85) {

            title = "Excellent!";

            icon = "🏆";

            message =
                "Outstanding performance! Your preparation and understanding are excellent.";

        }

        else if (percentage >= 60) {

            title = "Good Job!";

            icon = "👏";

            message =
                "Good performance! Keep practicing and you can reach the excellent level.";

        }

        else {

            title = "Needs Improvement";

            icon = "📚";

            message =
                "Keep learning and practicing. Review the topics and try the quiz again.";

        }

        const token = localStorage.getItem("token");

        if (token) {
            try {
                await fetch((window.location.hostname === "gyaan-ai-backend.onrender.com" ? "https://gyaan-ai-backend.onrender.com" : "") + "/api/quiz-attempts", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": "Bearer " + token
                    },
                    body: JSON.stringify({
                        subject: subjectNames[selectedSubject] || selectedSubject,
                        classLevel: selectedClass,
                        score,
                        total,
                        percentage,
                        summary: message
                    })
                });
            } catch (error) {
                console.error("Unable to save quiz attempt:", error);
            }
        }


        document.getElementById("quizSection").style.display =
            "none";

        document.getElementById("resultSection").style.display =
            "block";


        document.getElementById("resultIcon").innerText =
            icon;

        document.getElementById("resultTitle").innerText =
            title;

        document.getElementById("correctScore").innerText =
            score;

        document.getElementById("percentage").innerText =
            percentage + "%";

        document.getElementById("resultMessage").innerText =
            message;

    }


    /* =====================================================
       RETAKE
       ===================================================== */

    function retakeQuiz() {

        selectedAnswers =
            new Array(quizQuestions.length).fill(null);

        currentQuestion = 0;

        document.getElementById("resultSection").style.display =
            "none";

        document.getElementById("quizSection").style.display =
            "block";

        showQuestion();

    }


    /* =====================================================
       HOME
       ===================================================== */

    function goHome() {

        document.getElementById("resultSection").style.display =
            "none";

        document.getElementById("quizSection").style.display =
            "none";

        document.getElementById("setupSection").style.display =
            "block";

    }


    /* =====================================================
       BACK BUTTON
       ===================================================== */

    function goBack() {

        if (
            document.getElementById("quizSection").style.display ===
            "block"
        ) {

            if (
                confirm(
                    "Are you sure you want to leave this quiz?"
                )
            ) {

                goHome();

            }

            return;
        }


        window.location.href = "/";

    }


    /* =====================================================
       VOICE
       ===================================================== */

    function speakQuestion() {

        if (!("speechSynthesis" in window)) {

            alert(
                "Voice is not supported in this browser."
            );

            return;
        }


        speechSynthesis.cancel();


        const text =
            quizQuestions[currentQuestion].question;


        const utterance =
            new SpeechSynthesisUtterance(text);


        if (
            selectedSubject === "marathi"
        ) {

            utterance.lang = "mr-IN";

        }

        else if (
            selectedSubject === "hindi"
        ) {

            utterance.lang = "hi-IN";

        }

        else {

            utterance.lang = "en-IN";

        }


        utterance.rate = 0.9;

        speechSynthesis.speak(utterance);

    }


    /* =====================================================
       TRANSLATION
       ===================================================== */

    async function translateQuestion() {

        const question =
            quizQuestions[currentQuestion].question;


        const box =
            document.getElementById("translationBox");


        box.style.display = "block";

        box.innerText =
            "Translating...";


        /*
          MyMemory free translation API.
          For production use, backend translation API
          is recommended.
        */


        try {

            const response =
                await fetch(
                    "https://api.mymemory.translated.net/get?q=" +
                    encodeURIComponent(question) +
                    "&langpair=en|hi"
                );


            const data =
                await response.json();


            if (
                data &&
                data.responseData &&
                data.responseData.translatedText
            ) {

                box.innerHTML =
                    "<strong>Hindi Translation:</strong><br>" +
                    escapeHTML(
                        data.responseData.translatedText
                    );

            } else {

                box.innerText =
                    "Translation unavailable.";

            }

        }

        catch (error) {

            box.innerText =
                "Translation service unavailable. Please try again.";

        }

    }


    /* =====================================================
       SECURITY
       ===================================================== */

    function escapeHTML(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }

</script>

</body>
<script src="common.js"></script>
</html>
