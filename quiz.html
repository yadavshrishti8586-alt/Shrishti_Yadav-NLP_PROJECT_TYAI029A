<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Tutor - Quiz</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #202020;
            font-family: Arial, sans-serif;
        }

        .quiz-screen {
            width: 360px;
            height: 780px;
            background: #f4f0ff;
            position: relative;
            padding: 24px 20px;
            overflow: hidden;
        }

        /* HEADER */

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-button {
            width: 35px;
            height: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            cursor: pointer;
            border-radius: 50%;
        }

        .back-button:hover {
            background: #ded8f5;
        }

        .header h1 {
            font-size: 22px;
            color: #273143;
        }

        .profile {
            font-size: 20px;
            cursor: pointer;
        }

        /* PROGRESS */

        .progress-info {
            margin-top: 45px;
            text-align: center;
            color: #747b8b;
            font-size: 17px;
        }

        .progress-container {
            width: 290px;
            margin: 15px auto 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .progress-bar {
            width: 250px;
            height: 7px;
            background: #dedfe3;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            width: 10%;
            height: 100%;
            background: #16b8aa;
            border-radius: 10px;
            transition: width 0.3s;
        }

        .percentage {
            font-size: 14px;
            font-weight: bold;
        }

        /* QUIZ TITLE */

        .quiz-title {
            width: 291px;
            height: 91px;
            margin: 45px auto 13px;
            background: #dceaff;
            border-radius: 18px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            font-size: 21px;
        }

        .quiz-title-icon {
            font-size: 18px;
            margin-bottom: 5px;
        }

        /* QUESTION */

        .question-box {
            width: 291px;
            min-height: 90px;
            background: white;
            border-radius: 18px;
            margin: auto;
            padding: 13px 12px;
        }

        .question {
            font-size: 17px;
            font-weight: bold;
            color: #273143;
            line-height: 1.3;
        }

        .question-actions {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            gap: 25px;
            font-size: 13px;
        }

        .question-actions span {
            cursor: pointer;
        }

        /* OPTIONS */

        .options {
            width: 291px;
            margin: 16px auto 0;
        }

        .option {
            width: 100%;
            min-height: 40px;
            border: none;
            background: white;
            padding: 9px 14px;
            text-align: left;
            font-size: 14px;
            cursor: pointer;
            border-radius: 10px;
            margin-bottom: 6px;
        }

        .option:hover {
            background: #e8f8f5;
        }

        .option.selected {
            background: #c8f4ec;
            border: 2px solid #16b8aa;
        }

        /* NAVIGATION */

        .quiz-navigation {
            display: flex;
            justify-content: space-between;
            width: 291px;
            margin: 18px auto 0;
        }

        .nav-button {
            width: 105px;
            height: 40px;
            border: none;
            border-radius: 11px;
            font-size: 14px;
            cursor: pointer;
        }

        .previous {
            background: #d5d8df;
            color: #333;
        }

        .next {
            background: #16b8aa;
            color: white;
        }

        .nav-button:hover {
            opacity: 0.85;
        }

        /* SUBMIT */

        .submit {
            display: block;
            width: 291px;
            height: 44px;
            border: none;
            border-radius: 11px;
            background: #16b8aa;
            color: white;
            font-size: 16px;
            margin: 14px auto 0;
            cursor: pointer;
        }

        .submit:hover {
            background: #109e94;
        }

        /* BOTTOM NAV */

        .bottom-nav {
            position: absolute;
            bottom: 18px;
            left: 25px;
            right: 25px;
            display: flex;
            justify-content: space-between;
            text-align: center;
        }

        .nav-item {
            font-size: 14px;
            cursor: pointer;
        }

        .nav-icon {
            display: block;
            font-size: 14px;
            margin-bottom: 5px;
        }

    </style>
</head>

<body>

<div class="quiz-screen">

    <!-- HEADER -->

    <div class="header">

        <div
            class="back-button"
            onclick="goBack()">

            ←

        </div>

        <h1>
            Quiz
        </h1>

        <div
            class="profile"
            onclick="goProfile()">

            👤

        </div>

    </div>


    <!-- PROGRESS -->

    <div
        class="progress-info"
        id="progressInfo">

        Question 1 of 10

    </div>


    <div class="progress-container">

        <div class="progress-bar">

            <div
                class="progress-fill"
                id="progressFill">
            </div>

        </div>

        <div
            class="percentage"
            id="percentage">

            10%

        </div>

    </div>


    <!-- QUIZ TITLE -->

    <div class="quiz-title">

        <div class="quiz-title-icon">
            📝
        </div>

        AI Quiz

    </div>


    <!-- QUESTION -->

    <div class="question-box">

        <div
            class="question"
            id="question">
        </div>


        <div class="question-actions">

            <span onclick="readQuestion()">
                🔊 Read
            </span>

            <span onclick="translateQuestion()">
                🌐 Translate
            </span>

        </div>

    </div>


    <!-- OPTIONS -->

    <div
        class="options"
        id="options">
    </div>


    <!-- PREVIOUS / NEXT -->

    <div class="quiz-navigation">

        <button
            class="nav-button previous"
            onclick="previousQuestion()"
            id="previousButton">

            Previous

        </button>


        <button
            class="nav-button next"
            onclick="nextQuestion()"
            id="nextButton">

            Next

        </button>

    </div>


    <!-- SUBMIT -->

    <button
        class="submit"
        onclick="submitQuiz()">

        Submit Quiz

    </button>


    <!-- BOTTOM NAVIGATION -->

    <div class="bottom-nav">

        <div
            class="nav-item"
            onclick="goHome()">

            <span class="nav-icon">
                🏠
            </span>

            Home

        </div>


        <div
            class="nav-item"
            onclick="goTutor()">

            <span class="nav-icon">
                🤖
            </span>

            Tutor

        </div>


        <div
            class="nav-item"
            onclick="goScanner()">

            <span class="nav-icon">
                📷
            </span>

            Scanner

        </div>


        <div
            class="nav-item"
            onclick="goProfile()">

            <span class="nav-icon">
                👤
            </span>

            Profile

        </div>

    </div>

</div>


<script>

/* ================================
   QUESTIONS
================================ */

const questions = [

    {
        question: "What is Artificial Intelligence?",
        options: [
            "A. Programming Language",
            "B. Computer Science Field",
            "C. Operating System",
            "D. Database"
        ],
        answer: "B. Computer Science Field"
    },

    {
        question: "Which language is commonly used in AI?",
        options: [
            "A. Python",
            "B. HTML",
            "C. CSS",
            "D. SQL"
        ],
        answer: "A. Python"
    },

    {
        question: "What does AI stand for?",
        options: [
            "A. Automated Internet",
            "B. Artificial Intelligence",
            "C. Advanced Information",
            "D. Artificial Internet"
        ],
        answer: "B. Artificial Intelligence"
    },

    {
        question: "Which is an example of AI?",
        options: [
            "A. Calculator",
            "B. Chatbot",
            "C. Keyboard",
            "D. Monitor"
        ],
        answer: "B. Chatbot"
    },

    {
        question: "What is Machine Learning?",
        options: [
            "A. Learning from data",
            "B. Making hardware",
            "C. Designing websites",
            "D. Creating databases"
        ],
        answer: "A. Learning from data"
    },

    {
        question: "Which technology is used for image recognition?",
        options: [
            "A. Computer Vision",
            "B. Spreadsheet",
            "C. Word Processor",
            "D. Compiler"
        ],
        answer: "A. Computer Vision"
    },

    {
        question: "What does NLP stand for?",
        options: [
            "A. Natural Language Processing",
            "B. Network Language Program",
            "C. New Learning Process",
            "D. Natural Logic Program"
        ],
        answer: "A. Natural Language Processing"
    },

    {
        question: "Which AI technique learns using labelled data?",
        options: [
            "A. Supervised Learning",
            "B. Unsupervised Learning",
            "C. Random Search",
            "D. Manual Learning"
        ],
        answer: "A. Supervised Learning"
    },

    {
        question: "Which algorithm is used for classification?",
        options: [
            "A. Logistic Regression",
            "B. HTML",
            "C. CSS",
            "D. XML"
        ],
        answer: "A. Logistic Regression"
    },

    {
        question: "Which is a popular deep learning framework?",
        options: [
            "A. TensorFlow",
            "B. Excel",
            "C. PowerPoint",
            "D. Notepad"
        ],
        answer: "A. TensorFlow"
    }

];


/* ================================
   VARIABLES
================================ */

let currentQuestion = 0;

let selectedAnswers =
    new Array(questions.length).fill("");


/* ================================
   LOAD QUESTION
================================ */

function loadQuestion() {

    const q =
        questions[currentQuestion];

    document.getElementById("question").innerText =
        q.question;


    const optionsContainer =
        document.getElementById("options");

    optionsContainer.innerHTML = "";


    q.options.forEach(function(option) {

        const button =
            document.createElement("button");

        button.className = "option";

        button.innerText = option;


        if (
            selectedAnswers[currentQuestion]
            === option
        ) {

            button.classList.add("selected");

        }


        button.onclick = function() {

            selectOption(option, button);

        };


        optionsContainer.appendChild(button);

    });


    updateProgress();

    updateButtons();

}


/* ================================
   SELECT OPTION
================================ */

function selectOption(option, button) {

    document
        .querySelectorAll(".option")
        .forEach(function(item) {

            item.classList.remove("selected");

        });


    button.classList.add("selected");


    selectedAnswers[currentQuestion] =
        option;

}


/* ================================
   NEXT
================================ */

function nextQuestion() {

    if (
        selectedAnswers[currentQuestion]
        === ""
    ) {

        alert("Please select an answer first.");

        return;
    }


    if (
        currentQuestion <
        questions.length - 1
    ) {

        currentQuestion++;

        loadQuestion();

    }

}


/* ================================
   PREVIOUS
================================ */

function previousQuestion() {

    if (currentQuestion > 0) {

        currentQuestion--;

        loadQuestion();

    }

}


/* ================================
   UPDATE PROGRESS
================================ */

function updateProgress() {

    const number =
        currentQuestion + 1;

    const total =
        questions.length;

    const percent =
        Math.round(
            (number / total) * 100
        );


    document.getElementById("progressInfo").innerText =
        "Question " + number + " of " + total;


    document.getElementById("progressFill").style.width =
        percent + "%";


    document.getElementById("percentage").innerText =
        percent + "%";

}


/* ================================
   BUTTON STATUS
================================ */

function updateButtons() {

    const previous =
        document.getElementById("previousButton");

    const next =
        document.getElementById("nextButton");


    if (currentQuestion === 0) {

        previous.disabled = true;

        previous.style.opacity = "0.5";

    }

    else {

        previous.disabled = false;

        previous.style.opacity = "1";

    }


    if (
        currentQuestion ===
        questions.length - 1
    ) {

        next.disabled = true;

        next.style.opacity = "0.5";

    }

    else {

        next.disabled = false;

        next.style.opacity = "1";

    }

}


/* ================================
   SUBMIT QUIZ
================================ */

function submitQuiz() {

    const unanswered =
        selectedAnswers.filter(
            answer => answer === ""
        ).length;


    if (unanswered > 0) {

        alert(
            "Please answer all questions before submitting."
        );

        return;
    }


    let score = 0;


    questions.forEach(function(question, index) {

        if (
            selectedAnswers[index]
            === question.answer
        ) {

            score++;

        }

    });


    const total =
        questions.length;


    const percentage =
        Math.round(
            (score / total) * 100
        );


    /* SAVE RESULT */

    localStorage.setItem(
        "quizScore",
        score
    );


    localStorage.setItem(
        "quizTotal",
        total
    );


    localStorage.setItem(
        "quizPercentage",
        percentage
    );


    /* OPEN RESULT PAGE */

    window.location.href =
        "result.html";

}


/* ================================
   READ QUESTION
================================ */

function readQuestion() {

    const text =
        questions[currentQuestion].question;


    if ("speechSynthesis" in window) {

        const speech =
            new SpeechSynthesisUtterance(text);

        speech.lang = "en-US";

        window.speechSynthesis.speak(speech);

    }

}


/* ================================
   TRANSLATE
================================ */

function translateQuestion() {

    alert(
        "Translation feature will be connected later."
    );

}


/* ================================
   BACK
================================ */

function goBack() {

    window.history.back();

}


/* ================================
   NAVIGATION
================================ */

function goHome() {

    window.location.href =
        "home.html";

}


function goTutor() {

    window.location.href =
        "tutor.html";

}


function goScanner() {

    window.location.href =
        "scanner.html";

}


function goProfile() {

    window.location.href =
        "profile.html";

}


/* ================================
   START
================================ */

loadQuestion();

</script>

</body>
</html>
